<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- CHANGE TITLE PER FOLDER -->
    <title>MJ Surgical - Arthroscopy Implants and Instruments</title>

    <!-- Page-Flip 3D Engine -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <!-- PDF.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --outer-bg: #1a1a1a;     /* Dark outer background default */
            --inner-bg: #5ca595;     /* Teal inner stage default */
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--outer-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease;
        }

        /* Top Control Panel - Responsive & Scrollable on Mobile */
        #control-panel {
            position: absolute;
            top: 8px;
            background: rgba(0, 0, 0, 0.85);
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            max-width: 95vw;
            overflow-x: auto;
            white-space: nowrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .control-panel-divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }

        .btn-theme {
            background: #ffffff;
            color: #222;
            border: none;
            padding: 4px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 3px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-theme:hover {
            transform: scale(1.05);
            background: #e0e0e0;
        }

        .btn-home {
            background: #2d3748;
            color: #ffffff;
        }

        .btn-home:hover {
            background: #4a5568;
            color: #ffffff;
        }

        .btn-download {
            background: #5ca595;
            color: #ffffff;
        }

        .btn-download:hover {
            background: #488a7b;
            color: #ffffff;
        }

        /* Stage Box Optimized for Mobile and Desktop */
        #flipbook-stage {
            width: 96vw;
            height: 85vh;
            max-width: 1550px;
            max-height: 920px;
            box-shadow: 0px 20px 50px rgba(0,0,0,0.5);
            background-color: var(--inner-bg);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.3s ease;
            padding: 10px 30px;
            overflow: hidden;
            margin-top: 35px;
        }

        #book-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book-container {
            display: none;
            margin: auto;
        }

        /* Navigation Arrows */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #111;
        }

        #prev-btn { left: 8px; }
        #next-btn { right: 8px; }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .page-canvas {
            box-shadow: 0 6px 22px rgba(0,0,0,0.28);
            background-color: #ffffff;
        }

        @media (max-width: 768px) {
            #flipbook-stage {
                width: 98vw;
                height: 82vh;
                padding: 5px 15px;
            }
            .nav-btn {
                width: 34px;
                height: 34px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        <!-- Home Button -->
        <a href="../" class="btn-theme btn-home">← Home</a>

        <div class="control-panel-divider"></div>

        <div class="control-group">
            <span>Inner Stage:</span>
            <button class="btn-theme" onclick="setInnerBg('#5ca595')">Teal</button>
            <button class="btn-theme" onclick="setInnerBg('#ffffff')">White</button>
            <button class="btn-theme" onclick="setInnerBg('#2b2b2b')">Dark</button>
        </div>

        <div class="control-panel-divider"></div>

        <!-- Download PDF Button -->
        <button class="btn-theme btn-download" onclick="downloadPDF()">📥 Download</button>

        <button class="btn-theme" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>

    <!-- Main Stage Box -->
    <div id="flipbook-stage">
        <button id="prev-btn" class="nav-btn" title="Previous Page">&#10094;</button>
        <button id="next-btn" class="nav-btn" title="Next Page">&#10095;</button>

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <span id="loading-text">LOADING BROCHURE...</span>
        </div>

        <div id="book-wrapper">
            <div id="book-container"></div>
        </div>
    </div>

    <script>
        // Set Default PDF Download Name per Folder:
        // arthroscopy/index.html -> "Arthroscopy Implants and Instruments.pdf"
        // cranial-maxillofacial/index.html -> "Cranial-Maxillofacial Implants and Instruments.pdf"
        // hip-replacement/index.html -> "Hip Replacement Implants and Instruments.pdf"
        // spine-implants/index.html -> "Spine Implants & Instruments.pdf"
        // trauma-implants/index.html -> "Trauma Implants.pdf"
        const downloadName = "Arthroscopy Implants and Instruments.pdf";

        function setInnerBg(color) {
            document.documentElement.style.setProperty('--inner-bg', color);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function downloadPDF() {
            const link = document.createElement('a');
            link.href = './document.pdf';
            link.download = downloadName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        let globalPageFlip = null;

        async function loadPDFBook() {
            const loadingText = document.getElementById('loading-text');
            const url = './document.pdf'; 
            
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            try {
                loadingText.innerText = 'LOADING BROCHURE...';
                
                const loadingTask = pdfjsLib.getDocument({
                    url: url,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',
                    cMapPacked: true,
                });

                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                const bookContainer = document.getElementById('book-container');
                
                const firstPage = await pdfDoc.getPage(1);
                const unscaledViewport = firstPage.getViewport({ scale: 1.0 });

                const stage = document.getElementById('flipbook-stage');
                const isMobile = window.innerWidth <= 768;
                
                // Responsive sizing bounds
                const availHeight = stage.clientHeight - 20;
                // On mobile, show single page view for readability; on desktop, dual spread
                const availWidth = isMobile ? (stage.clientWidth - 30) : ((stage.clientWidth - 60) / 2);

                const scale = Math.min(availHeight / unscaledViewport.height, availWidth / unscaledViewport.width);

                const displayWidth = Math.round(unscaledViewport.width * scale);
                const displayHeight = Math.round(unscaledViewport.height * scale);

                for (let i = 1; i <= numPages; i++) {
                    loadingText.innerText = `PROCESSING PAGE ${i} OF ${numPages}...`;

                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: scale * 2.0 }); 
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    canvas.style.width = displayWidth + 'px';
                    canvas.style.height = displayHeight + 'px';
                    canvas.className = 'page-canvas';

                    await page.render({ 
                        canvasContext: context, 
                        viewport: viewport 
                    }).promise;

                    bookContainer.appendChild(canvas);
                }

                document.getElementById('loading-screen').style.display = 'none';
                bookContainer.style.display = 'block';

                globalPageFlip = new St.PageFlip(bookContainer, {
                    width: displayWidth,
                    height: displayHeight,
                    size: isMobile ? "fixed" : "fixed",
                    minWidth: 220,
                    maxWidth: 850,
                    minHeight: 300,
                    maxHeight: 1200,
                    maxShadowOpacity: 0.45,
                    showCover: true,
                    mobileScrollSupport: false,
                    useMouse: true,
                    flippingTime: 800,
                    // Force single page on mobile screens for perfect readability
                    display: isMobile ? "single" : "double"
                });

                globalPageFlip.loadFromHTML(document.querySelectorAll('.page-canvas'));

                document.getElementById('next-btn').onclick = () => globalPageFlip.flipNext();
                document.getElementById('prev-btn').onclick = () => globalPageFlip.flipPrev();

                document.onkeydown = (e) => {
                    if (e.key === 'ArrowRight') globalPageFlip.flipNext();
                    if (e.key === 'ArrowLeft') globalPageFlip.flipPrev();
                };

            } catch (error) {
                console.error("PDF Loading Error: ", error);
                document.getElementById('loading-screen').innerHTML = `
                    <div style="color:#ff6b6b; font-size:12px; line-height:1.5;">
                        <strong>FAILED TO LOAD BROCHURE</strong><br/>
                        ${error.message || 'Check document.pdf in folder.'}
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadPDFBook);
    </script>
</body>
</html>
